# TLS termination overlay — docker compose -f docker-compose.yml -f deploy/tls/docker-compose.tls.yml up -d
#
# Prerequisites (on the host):
#   mkdir -p deploy/tls/certbot/{conf,www}
#   docker compose run --rm --entrypoint sh certbot -c \
#     "certbot certonly --webroot -w /var/www/certbot -d opslance.example.com --email you@example.com --agree-tos --no-eff-email"
#
# The nginx TLS config listens on 80 + 443: ACME challenges are served from the
# webroot, everything else on :80 redirects to HTTPS. Certificates are read-only
# mounted from certbot's conf dir; renewals run twice daily and reload nginx.

services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/tls/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/tls/certbot/www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./deploy/tls/certbot/conf:/etc/letsencrypt
      - ./deploy/tls/certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

  # nginx reloads every 6h so renewed certificates are picked up without manual action
  nginx-reloader:
    image: nginx:alpine
    depends_on:
      - nginx
    entrypoint: /bin/sh -c 'while :; do sleep 6h; nginx -s reload 2>/dev/null || docker exec "$${NGINX_CONTAINER:-opslance-nginx-1}" nginx -s reload || true; done'
    restart: always
