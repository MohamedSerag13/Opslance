server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Security headers for the SPA (these flow through the port-80 proxy to
    # the browser untouched, because the outer nginx adds none of its own).
    # - script-src carries the sha256 of the inline theme bootstrap in
    #   index.html; if that script changes, recompute and update the hash.
    # - 'unsafe-inline' styles are required: xterm injects inline style
    #   attributes on the terminal element.
    # - ws:/wss: covers the terminal + events websockets on the same origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Lq6hUBUL7WD09gc0x8oPP0xaohUGSmg/t1ObbPJHrG4='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed build assets; every response still carries the
    # security headers (nginx only inherits add_header into locations that
    # declare none of their own, so the headers are repeated here).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Lq6hUBUL7WD09gc0x8oPP0xaohUGSmg/t1ObbPJHrG4='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri =404;
    }
}
