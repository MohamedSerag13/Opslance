name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pgserver
      - name: Run test suite (real Postgres via pgserver + fakeredis)
        run: PYTHONPATH="$PWD" python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check + production build
        run: npm run build
      - name: Unit tests (Vitest + Testing Library)
        run: npx vitest run
      # Full E2E (Playwright + stub backend) runs on demand / nightly:
      #   pip install pgserver && python scripts/live_backend_runner_p4.py &
      #   npx playwright install chromium && npx playwright test
