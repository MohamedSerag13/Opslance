services:
  # One-shot job: generates POSTGRES_PASSWORD and SECRET_KEY the first time
  # the stack comes up and persists them in the `app_secrets` volume. All
  # other services read from that volume; values set in .env take precedence.
  secrets-init:
    image: alpine:3.19
    command: sh /scripts/gen_secrets.sh
    volumes:
      - ./scripts/gen_secrets.sh:/scripts/gen_secrets.sh:ro
      - app_secrets:/secrets
    restart: "no"

  # One-shot: database migrations + admin seeding, in the backend image. It
  # KEEPS the shared entrypoint so DATABASE_URL gets filled from the generated
  # secrets (the entrypoint skips its wait/sync extras unless DB_WAIT=1).
  # If this fails, `docker compose logs db-init` shows exactly which step and why.
  db-init:
    build:
      context: ./backend
    command:
      - sh
      - -c
      - |
        echo ">>> [db-init] running migrations (alembic upgrade head)"
        alembic upgrade head || exit 1
        echo ">>> [db-init] seeding admin + default group"
        PYTHONPATH="${PYTHONPATH:-/app}" python scripts/seed_admin.py || exit 1
        echo ">>> [db-init] seeding courses catalog"
        PYTHONPATH="${PYTHONPATH:-/app}" LABS_DIR=/labs-repo/linux python scripts/seed_courses.py || exit 1
        echo ">>> [db-init] complete"
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - ./backend/alembic:/app/alembic
      - ${LABS_HOST_PATH:-../labs}:/labs-repo:ro
      - app_secrets:/secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: "no"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
    environment:
      - NODE_ENV=production
    restart: always
    # Served internally to nginx

  backend:
    build:
      context: ./backend
    # No published port: the backend is reachable only through nginx (:80),
    # so its CSP headers and rate-limit view can't be bypassed from outside.
    environment:
      # Empty values fall back to the generated secrets (backend/docker-entrypoint.sh)
      - DATABASE_URL=${DATABASE_URL:-}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      # empty: docker-entrypoint.sh fills it from the generated redis_password
      - REDIS_URL=${REDIS_URL:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Cross-origin grants for external integrations only — same-origin by default
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Backend role: entrypoint waits for the DB, syncs labs (non-fatal)
      - DB_WAIT=1
      # Container exec + terminal PTY are proxied to the lab-manager over the
      # internal network — the backend holds no Docker socket of its own.
      - LAB_MANAGER_URL=http://lab-manager:8100
      # Shared internal exec/PTY token (empty: docker-entrypoint.sh derives it
      # from the generated SECRET_KEY)
      - LAB_API_TOKEN=${LAB_API_TOKEN:-}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      - ${LABS_HOST_PATH:-../labs}:/labs-repo:ro
      - ./backend/alembic:/app/alembic
      - app_secrets:/secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Migrations + seeding + lab sync run before uvicorn binds; start_period
    # keeps the first boot from being flagged unhealthy while it works
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u, sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: always

  lab-manager:
    build:
      context: .
      dockerfile: lab-manager/Dockerfile
    environment:
      # empty: docker-entrypoint.sh fills it from the generated redis_password
      - REDIS_URL=${REDIS_URL:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      # Shared token for the internal exec/PTY API (empty: the entrypoint
      # derives it from the generated SECRET_KEY, matching the backend)
      - LAB_API_TOKEN=${LAB_API_TOKEN:-}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      # Host-absolute path of the labs dir, used to rewrite bind mounts for
      # lab containers (resolved by the host Docker daemon). Leave empty to
      # auto-detect it from this container's mount table (worker.py).
      - LABS_HOST_PATH=${LABS_HOST_PATH:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${LABS_HOST_PATH:-../labs}:/labs-repo:ro
      - app_secrets:/secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  postgres:
    image: postgres:15-alpine
    # Use the generated password unless POSTGRES_PASSWORD is set explicitly
    entrypoint: ["/bin/sh", "-c", "export POSTGRES_PASSWORD=\"$${POSTGRES_PASSWORD:-$$(cat /secrets/postgres_password)}\"; exec docker-entrypoint.sh postgres"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: lab_platform
      # Empty unless pinned in .env; the entrypoint falls back to the
      # generated password in /secrets/postgres_password when it is empty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - app_secrets:/secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    # requirepass from the generated secrets + AOF persistence so leaderboard
    # and rate-limit state survive restarts.
    command: ["/bin/sh", "-c", "exec redis-server --requirepass \"$$(cat /secrets/redis_password)\" --appendonly yes --appendfsync everysec"]
    volumes:
      - redis_data:/data
      - app_secrets:/secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$(cat /secrets/redis_password) ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

volumes:
  postgres_data:
  redis_data:
  app_secrets:
