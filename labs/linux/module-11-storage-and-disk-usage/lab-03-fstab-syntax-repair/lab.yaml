  prompt: every non-comment fstab line has exactly 6 fields
  context: null
  hints:
  - title: The six fields
    content: 'fstab lines are: device, mount point, filesystem type, options, dump freq, pass no. — e.g.
      `/dev/sdb1 /mnt/data ext4 defaults 0 2`.'
  - title: Field-count check
    content: '`awk ''!/^#/ && NF>0 { if (NF!=6) bad=1 } END { exit bad }'' /etc/fstab` exits non-zero
      while any line is malformed — the runbook''s pre-reboot gate.'
  - title: Replace the whole line
    content: '`sudo sed -i ''s|^//10.0.0.30/share$|/dev/sdb1 /mnt/data ext4 defaults 0 2|'' /etc/fstab`
      swaps the orphan for the correct entry in one shot.'
