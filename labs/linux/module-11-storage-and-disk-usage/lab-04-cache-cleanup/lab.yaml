  prompt: no *.o files remain anywhere under the build cache
  context: null
  hints:
  - title: Preview before delete
    content: Run `find … -name '*.o'` without -delete first and eyeball the list — deleting is forever.
  - title: The -delete action
    content: '`find dir -name ''*.o'' -delete` removes every match in the whole tree, in one command.
      No wildcards in a rm that could mis-expand.'
  - title: Quote the glob
    content: 'If you use rm instead, quote it: `sudo find … -exec rm {} +` or `rm ''*.o''` — an unquoted
      *.o only matches the CURRENT directory''s files.'
