  prompt: .bashrc sets APP_ENV=production
  context: null
  hints:
  - title: export makes it visible
    content: A variable without export exists only in the current shell. Child processes (like runapp.sh)
      only see EXPORTED variables.
  - title: Where to put it
    content: runapp.sh sources ~/.bashrc, so exports added there are picked up on its next run — no need
      to edit the launcher.
  - title: Values or variables?
    content: '`export APP_ENV=production` sets the literal string. Writing $APP_ENV=... would be an error
      — the dollar sign is only for READING variables.'
  solution: null
