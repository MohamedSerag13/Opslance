  prompt: the PATH-wiping line is gone from .bashrc
  context: null
  hints:
  - title: = vs :=
    content: PATH is a colon-separated list. `export PATH=/usr/local/apps/bin` REPLACES the whole list;
      `export PATH="$PATH:/usr/local/apps/bin"` KEEPS the old value and adds yours at the end.
  - title: Always reference $PATH
    content: Any correct PATH line contains $PATH somewhere on the right-hand side. If it doesn't, it's
      a wipe.
  - title: Test like a fresh login
    content: '`env -i HOME=$HOME bash -c ''source ~/.bashrc; command -v ls''` simulates a clean shell
      — if ls resolves there, real logins will work.'
  solution: null
