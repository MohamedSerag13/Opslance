  prompt: .profile references .bashrc (the wiring exists)
  context: null
  hints:
  - title: Two kinds of shells
    content: Login shells (SSH, console, bash -l) read ~/.profile; non-login interactive shells (terminal
      tabs) read ~/.bashrc. Ubuntu wires them together FROM .profile — and that wiring is missing here.
  - title: The standard guard
    content: '`[ -n "$BASH_VERSION" ] && . "$HOME/.bashrc"` sources .bashrc only under bash (sh/dash would
      choke on bashisms).'
  - title: Prove it
    content: '`bash -l` starts a login shell: it reads .profile → sources .bashrc → APP_MODE must appear.'
  solution: null
