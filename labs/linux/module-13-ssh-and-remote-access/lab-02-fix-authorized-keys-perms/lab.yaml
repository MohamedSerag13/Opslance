  prompt: .ssh directory permissions are 700
  context: null
  hints:
  - title: sshd is strict
    content: sshd refuses authorized_keys that are writable by others or owned by another user — StrictModes
      protects you from a tampered file. No error reaches the client; the key is just ignored.
  - title: Two chmods
    content: 'Directory: `chmod 700 ~/.ssh`. File: `chmod 600 ~/.ssh/authorized_keys`.'
  - title: Ownership matters too
    content: 'The file must belong to the LOGIN user: `sudo chown intern:intern ~/.ssh/authorized_keys`
      — chown needs root even for your own file.'
  solution: null
  explanation: null
