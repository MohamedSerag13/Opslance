  domain: services
  weight: 40
  prompt: systemctl reports broken-app as active (running)
  context: null
  hints:
  - title: Trigger the failure and read the error
    content: Run 'systemctl start broken-app'. It will fail. Then run 'systemctl status broken-app' to
      see the Active line change to 'failed'. The last few log lines shown in the status output will hint
      at the cause.
  - title: Dig deeper with journalctl
    content: Run 'journalctl -u broken-app' to see the full journal for this unit. Look for a line containing
      'No such file or directory' — it will tell you exactly which file is missing.
  - title: Read the unit file to find the expected path
    content: Run 'cat /etc/systemd/system/broken-app.service' and look at the ExecStart= line. That is
      the exact path the service manager will try to execute.
  solution: null
