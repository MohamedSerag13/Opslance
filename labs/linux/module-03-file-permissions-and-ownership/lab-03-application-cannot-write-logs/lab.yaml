  - title: Change ownership
    content: The 'chown' command changes file ownership. The syntax is 'chown user:group file'. You will
      need sudo to change ownership of a file you do not own.
  - title: Full solution pattern
    content: Run 'sudo chown intern:intern logs/app.log' to take ownership, then 'echo "Application started"
