  prompt: ~/df_output.txt exists and contains the df output
  context: null
  hints:
  - title: Disk Free Space
    content: You can output disk status to a file using `df -h > /home/intern/df_output.txt`.
  - title: Disk Usage by Folder
    content: Run `du -sh /home/intern/data/* | sort -h` to see which directory takes the most space. Write
      that directory name (e.g. 'backups') into `disk_report.txt`.
  - title: Finding the Largest File
    content: Use find with sort, e.g. `find /home/intern/data -type f -exec du -ah {} + | sort -rh | head
      -n 1` to find the largest file, and write its path to `largest_file.txt`.
  solution: null
