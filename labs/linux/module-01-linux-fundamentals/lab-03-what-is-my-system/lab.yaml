  prompt: system-report.txt exists and is not empty
  context: null
  hints:
  - title: Where to look
    content: 'Start by navigating to your home directory using `cd /home/intern`. Then, run basic discovery
      commands: `whoami` tells you who you are, `pwd` tells you where you are. Run both.'
  - title: What to check
    content: The hostname is shown by the hostname command. Use file redirection to construct the report.
  - title: The fix
    content: 'Run these commands to build your report:

      cd /home/intern

      echo "Username: $(whoami)" > system-report.txt

      echo "Hostname: $(hostname)" >> system-report.txt

      echo "Home: /home/intern" >> system-report.txt

      echo "PWD: $(pwd)" >> system-report.txt'
  solution: null
  explanation: null
