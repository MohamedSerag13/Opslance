  prompt: /etc/app/staging.conf exists
  context: null
  hints:
  - title: Where to look
    content: Run ls -l in your home directory to find staging.conf and the backup files.
  - title: What to check
    content: Use mkdir -p to create /etc/app/ before you try to move the config file there.
  - title: The fix
    content: 'sudo mkdir -p /etc/app

      mv ~/staging.conf /etc/app/staging.conf

      cp /etc/app/staging.conf /etc/app/production.conf

      rm ~/backup-*.tar.gz

      sudo mkdir -p /var/app/data'
