  - title: Count lines
    content: '`wc -l` counts lines. The report format is total=<number>, e.g. total=42.'
  - title: Filter then count
    content: '`grep -c '' 404 ''` prints only a count of matching lines. The status is surrounded by spaces
      in the log, which keeps the match exact.'
  - title: Top talker pipeline
    content: '`awk ''{print $1}''` takes the first column (the IP). Piping through `sort | uniq -c | sort
