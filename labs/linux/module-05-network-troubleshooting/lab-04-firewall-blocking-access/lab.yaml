  prompt: Gatekeeper is listening on port 8080
  context: null
  hints:
  - title: Confirm the service is running
    content: Run 'ss -tulnp'. You should see the gatekeeper listening on port 8080. Then run 'curl localhost:8080'
      — it should return HTTP 200. The service is up; the firewall is the issue.
  - title: Check the firewall
    content: Run 'sudo ufw status'. Look at the rules table. You'll see port 8080 is listed as DENY —
      that's why remote connections get blocked.
  - title: Allow port 8080
    content: 'Run: sudo ufw allow 8080 — this adds an ALLOW rule for port 8080. Then run ''sudo ufw status''
      again to confirm the rule changed to ALLOW.'
  solution: null
