  prompt: ServiceAccount dev-sa exists in ns dev
  context: null
  hints:
  - title: Prove, do not assume
    content: Tasks 4, 5 and 7 are auth can-i --as checks - the exam does exactly this. If a check fails,
      read the can-i output before touching RBAC again.
  - title: The CSR pipeline
    content: openssl genrsa + req -new -subj /CN=jane, base64 the .csr, apply a CertificateSigningRequest
      with signerName kubernetes.io/kube-apiserver-client and usages [client auth], then kubectl certificate
      approve. The issued cert lands in status.certificate (base64).
  - title: jane kubeconfig
    content: Use --certificate-authority /etcd-tls/etcd/ca.crt (it is the cluster CA) and embed everything.
      A working authn shows can-i = no, because jane has no RBAC yet - that no IS the success signal.
  solution: null
  explanation: null
  check:
    script: /check.sh
    index: 1
    kind: task
    description: ServiceAccount dev-sa exists in ns dev
  time_target_minutes: 12
  description: Create ServiceAccount dev-sa in namespace dev. The check runs `kubectl get sa dev-sa -n
    dev`.
