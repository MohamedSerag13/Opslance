  context: null
  hints:
  - title: Drain proof
    content: bare-worker has no owner References, so after drain + uncordon it is gone for good - that
      is your proof the drain actually evicted it. Deployments come back; bare pods do not.
  - title: The exam etcd flow
    content: On the exam you run etcdctl ON the control plane with the certs from /etc/kubernetes/pki/etcd.
      Here the helper pod mounts the k3s equivalents (/tls) and talks to 127.0.0.1:2379 via hostNetwork
      - same steps, same flags, copy them exactly.
  - title: snapshot status is offline
    content: etcdctl snapshot status works on the file alone - no cluster contact. Use it to verify /root/etcd-backup.db
      is a real snapshot.
  solution: null
