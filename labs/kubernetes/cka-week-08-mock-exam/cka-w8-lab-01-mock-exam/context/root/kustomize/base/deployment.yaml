apiVersion: apps/v1
kind: Deployment
metadata:
  name: kust-web
  labels:
    app: kust-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kust-web
  template:
    metadata:
      labels:
        app: kust-web
    spec:
      containers:
      - name: web
        image: nginx:1.27
        ports:
        - containerPort: 80
